name: Bug report
description: Report a reproducible build, packaging, or documentation failure.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the failure and its impact. Name the affected target and branch or release tag.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        List the commands, expected result, and actual result. Include the relevant platform and tool versions. Remove credentials, private paths, and sensitive output.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        Link relevant files, issues, or pull requests. Report passing, failed, and unrun checks separately.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: >-
        Describe the observable result that resolves the failure. State any scope exclusions.
    validations:
      required: false
