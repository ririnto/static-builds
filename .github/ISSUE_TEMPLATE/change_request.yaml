name: Change request
description: Propose a scoped improvement with evidence and acceptance criteria.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current behavior and the reason for changing it.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: >-
        Name the affected targets or files and the proposed change. State what remains outside this request.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >-
        Link the relevant source, prior issue, or pull request. Separate confirmed observations from unverified assumptions.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: >-
        List the observable results and verification needed to complete this request.
    validations:
      required: false
  - type: textarea
    id: ownership-and-next-action
    attributes:
      label: Ownership and next action
      description: Name the owner and the next concrete action.
    validations:
      required: false
