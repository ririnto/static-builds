name: Set up rootless BuildKit
description: Install native BuildKit without changing runner security settings

runs:
  using: composite
  steps:
    - name: Install rootless BuildKit dependencies
      shell: sh
      run: |-
        if ! command -v rootlesskit || ! command -v newuidmap || ! command -v newgidmap || ! command -v runc; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rootlesskit uidmap runc
        fi

    - name: Configure rootless BuildKit
      shell: sh
      run: |-
        mkdir -p "$RUNNER_TEMP/buildkit-runtime"
        chmod 700 "$RUNNER_TEMP/buildkit-runtime"
        echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/buildkit-runtime" >>"$GITHUB_ENV"
        echo "BUILDCTL_CONNECT_RETRIES_MAX=300" >>"$GITHUB_ENV"
        echo "BUILDCTL=go tool buildctl" >>"$GITHUB_ENV"
        echo "BUILDKITD=go tool buildkitd" >>"$GITHUB_ENV"
        echo "BUILDKITD_FLAGS=--root=$HOME/.local/share/buildkit --oci-worker-snapshotter=native" >>"$GITHUB_ENV"
