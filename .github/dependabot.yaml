version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "@tsconfig/node-lts"
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
      - dependency-type: indirect
        dependency-name: github.com/go-task/task/v3
      - dependency-type: indirect
        dependency-name: github.com/golangci/golangci-lint/v2
      - dependency-type: indirect
        dependency-name: github.com/google/go-jsonnet
      - dependency-type: indirect
        dependency-name: github.com/goreleaser/goreleaser/v2
      - dependency-type: indirect
        dependency-name: go.uber.org/nilaway
      - dependency-type: indirect
        dependency-name: mvdan.cc/sh/v3
