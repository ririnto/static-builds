name: Tooling Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    name: Go tooling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            internal/tools/goreleaser/go.sum

      - name: Check Go module files
        run: go tool task tidy -- -diff

      - name: Check Go commands
        run: go tool task test

      - name: Lint Go source
        run: go tool task golangci-lint -- run ./...

      - name: Check nil safety
        run: go tool task nilaway -- ./...

      - name: Check shell formatting
        run: go tool task shfmt -- -d

      - name: Check Jsonnet formatting
        run: go tool task jsonnetfmt -- --test
