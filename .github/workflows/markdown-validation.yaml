name: Markdown Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown and tooling checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Markdown rules
        run: pnpm run check:markdownlint-cli2

      - name: Check custom Markdown rules
        run: pnpm run check:lint-rules

      - name: Check TypeScript
        run: pnpm run check:typescript

      - name: Check Ultracite
        run: pnpm run check:ultracite

  fences:
    name: Code fences
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check closed code fences
        uses: rvben/rumdl@v0.2.79
        with:
          version: 0.2.79
          path: .
          args: >-
            --enable MD046 --no-cache --respect-gitignore

  links:
    name: Relative links
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check relative files and heading links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml '**/*.md'
          output: ${{ runner.temp }}/markdown-links.md
