name: Release From Tag

on:
  push:
    tags:
      - 'nginx-upstream-healthcheck-*'
      - 'nginx-*'
      - 'haproxy-*'
      - 'apache-exporter-*'
      - 'httpd-*'
      - 'coredns-*'
      - 'dnsmasq-*'
      - 'vector-*'
      - 'monit-*'

jobs:
  resolve-target:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve and validate release target
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |-
          TARGET=$(sh scripts/metadata.sh get-target-from-tag "$TAG")
          sh .github/scripts/release-guard.sh "$TARGET" "$TAG"
          printf 'target=%s\n' "$TARGET" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve-target
    permissions:
      contents: write
      security-events: write
    uses: ./.github/workflows/template-release.yaml
    with:
      target: ${{ needs.resolve-target.outputs.target }}
      tag: ${{ github.ref_name }}
      upload_release: true
