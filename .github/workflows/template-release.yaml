name: Template Release

on:
  workflow_call:
    inputs:
      target:
        description: Build target directory name
        required: true
        type: string
      tag:
        description: Release tag name
        required: true
        type: string
      upload_release:
        description: Upload selected binary to GitHub Release
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate release tag
        env:
          TARGET: ${{ inputs.target }}
          TAG: ${{ inputs.tag }}
        run: |-
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          prefix=$(go tool task manifest -- get-tag-prefix "$TARGET")
          official=$(go tool task manifest -- get-official-version "$TARGET")
          test "${TAG#"$prefix"-}" != "$TAG"
          version_revision=${TAG#"$prefix"-}
          test "${version_revision%.*}" != "$version_revision"
          version=${version_revision%.*}
          echo "${version_revision##*.}" | grep -E '^[0-9]+$'
          if [ "$version" != "$official" ]; then
            test "${version#"$official"-}" != "$version"
            echo "${version#"$official"-}" | grep -E '^[A-Za-z0-9]+([.-][A-Za-z0-9]+)*$'
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.tmp
          key: tmp-${{ inputs.target }}-${{ hashFiles('metadata.json', 'cmd/**/*.go', 'internal/**/*.go', 'go.mod', 'go.sum') }}
          restore-keys: tmp-${{ inputs.target }}-

      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build target
        env:
          BUILDKIT_CACHE_BACKEND: gha
          BUILD_OUTPUT_DEST: ${{ github.workspace }}/.out/${{ inputs.target }}
          TARGET: ${{ inputs.target }}
        run: go tool task build -- "$TARGET"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: ".out/${{ inputs.target }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Create release package
        env:
          TARGET: ${{ inputs.target }}
          TAG: ${{ inputs.tag }}
        run: go tool task package -- "$TARGET" "$TAG"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-static-build
          path: .out/${{ inputs.target }}
          include-hidden-files: true

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-release-package
          path: |-
            .out/goreleaser/${{ inputs.tag }}.tar.gz
            .out/goreleaser/${{ inputs.tag }}_checksums.txt
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: release
    if: ${{ inputs.upload_release }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.target }}-release-package
          path: .out/release-package

      - name: Publish assets to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          RELEASE_ARCHIVE: .out/release-package/${{ inputs.tag }}.tar.gz
          TAG: ${{ inputs.tag }}
        run: go tool task goreleaser -- release --clean --skip=archive,validate
