name: Template Release

on:
  workflow_call:
    inputs:
      target:
        description: Build target directory name
        required: true
        type: string
      tag:
        description: Release tag name
        required: true
        type: string
      upload_release:
        description: Upload selected binary to GitHub Release
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            internal/tools/goreleaser/go.sum

      - name: Set up rootless BuildKit
        uses: ./.github/actions/setup-buildkit

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/downloads/${{ inputs.target }}
          key: downloads-${{ inputs.target }}-${{ hashFiles('metadata.json', 'cmd/**/*.go', 'internal/**/*.go', 'go.mod', 'go.sum') }}
          restore-keys: downloads-${{ inputs.target }}-

      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Select container image reference
        id: image
        if: ${{ inputs.upload_release }}
        env:
          TAG: ${{ inputs.tag }}
          TARGET_INPUT: ${{ inputs.target }}
        run: |-
          if [[ "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "reference=ghcr.io/${GITHUB_REPOSITORY,,}/$TARGET_INPUT:$TAG" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping container publication because the release tag is not a valid container tag."
          fi

      - name: Build and package with GoReleaser
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          TAG: ${{ inputs.tag }}
          TARGET_INPUT: ${{ inputs.target }}
          IMAGE: ${{ steps.image.outputs.reference }}
        run: |-
          image_options=()
          if [[ -n "$IMAGE" ]]; then
            image_options+=(
              --output "type=docker,name=$IMAGE,dest=$RUNNER_TEMP/image.tar"
              --opt "label:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            )
          fi
          go tool task download -- "$TARGET_INPUT"
          go tool task build -- "$TARGET_INPUT" \
            --output "type=local,dest=dist/$TARGET_INPUT" \
            --import-cache "type=gha,scope=$TARGET_INPUT" \
            --export-cache "type=gha,scope=$TARGET_INPUT,mode=max" \
            "${image_options[@]}"
          go tool task goreleaser -- "$TARGET_INPUT" release --clean --verbose --timeout=6h --skip=publish,validate

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "dist/${{ inputs.target }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-static-build
          path: dist/${{ inputs.target }}
          include-hidden-files: true

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-release-package
          path: |-
            dist/packages/${{ inputs.target }}-${{ inputs.tag }}.tgz
            dist/packages/${{ inputs.target }}-${{ inputs.tag }}.tgz.sha256
          include-hidden-files: true
          if-no-files-found: error

      - name: Compress container image
        if: ${{ steps.image.outputs.reference != '' }}
        run: gzip -c "$RUNNER_TEMP/image.tar" >"$RUNNER_TEMP/image.tgz"

      - name: Upload container image
        if: ${{ steps.image.outputs.reference != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-image
          path: ${{ runner.temp }}/image.tgz
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: release
    if: ${{ inputs.upload_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            internal/tools/goreleaser/go.sum

      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.target }}-release-package
          path: ${{ runner.temp }}/${{ inputs.target }}

      - name: Publish assets to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/${{ inputs.target }}/${{ inputs.target }}-${{ inputs.tag }}.tgz
          TAG: ${{ inputs.tag }}
          TARGET_INPUT: ${{ inputs.target }}
        run: go tool task goreleaser -- "$TARGET_INPUT" release --clean --skip=archive,validate

  publish-image:
    needs: release
    if: ${{ needs.release.outputs.image != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download container image
        uses: actions/download-artifact@v8
        with:
          name: release-image
          path: ${{ runner.temp }}

      - name: Publish container image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.release.outputs.image }}
        run: |-
          docker load --input "$RUNNER_TEMP/image.tgz"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
