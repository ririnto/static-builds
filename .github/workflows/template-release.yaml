name: Template Release

on:
  workflow_call:
    inputs:
      target:
        description: Build target directory name
        required: true
        type: string
      tag:
        description: Release tag name
        required: true
        type: string
      upload_release:
        description: Upload selected binary to GitHub Release
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate release tag
        env:
          TARGET: ${{ inputs.target }}
          TAG: ${{ inputs.tag }}
        run: |-
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          go tool task validate-release-tag -- "$TARGET" "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache source downloads
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/downloads
          key: downloads-${{ inputs.target }}-${{ hashFiles('metadata.json', 'cmd/**/*.go', 'internal/**/*.go', 'go.mod', 'go.sum') }}
          restore-keys: downloads-${{ inputs.target }}-

      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and package with GoReleaser
        env:
          BUILD_BACKEND: buildx
          BUILDKIT_CACHE_BACKEND: gha
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          TAG: ${{ inputs.tag }}
          BUILD_OUTPUT_DEST: ${{ github.workspace }}/dist/${{ inputs.target }}
          TARGET: ${{ inputs.target }}
        run: go tool task goreleaser -- release --clean --verbose --timeout=6h --skip=publish,validate

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "dist/${{ inputs.target }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-static-build
          path: dist/${{ inputs.target }}
          include-hidden-files: true

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-release-package
          path: |-
            dist/release/${{ inputs.tag }}.tar.gz
            dist/release/${{ inputs.tag }}_checksums.txt
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: release
    if: ${{ inputs.upload_release }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.target }}-release-package
          path: dist/release-package

      - name: Publish assets to release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          RELEASE_ARCHIVE: dist/release-package/${{ inputs.tag }}.tar.gz
          TAG: ${{ inputs.tag }}
        run: go tool task goreleaser -- release --clean --skip=before,archive,validate
