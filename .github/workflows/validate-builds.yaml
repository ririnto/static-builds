name: Build Validation

on:
  pull_request:
    paths:
      - ".github/workflows/validate-builds.yaml"
      - ".github/actions/setup-buildkit/**"
      - "compose.yaml"
      - ".goreleaser.yaml"
      - ".dockerignore"
      - "Taskfile.yaml"
      - "metadata.json"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "apache-exporter/**"
      - "apache-httpd/**"
      - "coredns/**"
      - "dnsmasq/**"
      - "haproxy/**"
      - "monit/**"
      - "nginx/**"
      - "nginx-upstream-healthcheck/**"
      - "vector/**"
      - "!**/*.md"
      - "!nginx/examples/**"
      - "!nginx/tsconfig.json"
      - "!nginx-upstream-healthcheck/examples/njs/**"
      - "!nginx-upstream-healthcheck/tsconfig.json"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Select metadata targets
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: matrix
        run: echo "targets=$(jq -c 'keys' metadata.json)" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    needs: matrix
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
        arch: [amd64, arm64]
        exclude:
          - target: vector
            arch: arm64
    env:
      TAG: pr-${{ github.event.pull_request.number }}-${{ matrix.arch }}
      GORELEASER_CURRENT_TAG: pr-${{ github.event.pull_request.number }}-${{ matrix.arch }}
      BUILDKIT_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up rootless BuildKit
        uses: ./.github/actions/setup-buildkit

      - name: Expose GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and package without publishing
        run: |-
          go tool task download -- "${{ matrix.target }}"
          go tool task build -- "${{ matrix.target }}" \
            --output "type=local,dest=dist/${{ matrix.target }}" \
            --import-cache "type=gha,scope=validation-${{ matrix.target }}-${{ matrix.arch }}" \
            --export-cache "type=gha,scope=validation-${{ matrix.target }}-${{ matrix.arch }},mode=max"
          go tool task goreleaser -- "${{ matrix.target }}" release --clean --snapshot --verbose --timeout=6h --skip=publish,validate

      - name: Verify release package
        run: |-
          RELEASE_FILES="$(go tool task manifest -- get-release-files "${{ matrix.target }}")" python3 - "${{ matrix.target }}" <<'PYTHON'
          import hashlib
          import os
          import stat
          import sys
          import tarfile
          from pathlib import Path

          package = Path(f"dist/packages/{sys.argv[1]}-{os.environ['TAG']}.tgz")
          if hashlib.sha256(package.read_bytes()).hexdigest() != package.with_suffix(".tgz.sha256").read_text().strip():
              raise SystemExit("Archive checksum mismatch")
          with tarfile.open(package) as archive:
              members = [member for member in archive.getmembers() if not member.isdir()]
              if sorted(member.name for member in members) != sorted(os.environ["RELEASE_FILES"].splitlines()):
                  raise SystemExit("Archive members differ from metadata")
              for member in members:
                  source = Path("dist") / sys.argv[1] / member.name
                  info = source.lstat()
                  if not member.isfile() or not stat.S_ISREG(info.st_mode) or member.mode != stat.S_IMODE(info.st_mode):
                      raise SystemExit(f"Archive file type or mode mismatch: {member.name}")
                  with archive.extractfile(member) as packaged:
                      if packaged.read() != source.read_bytes():
                          raise SystemExit(f"Archive content mismatch: {member.name}")
          print(f"Verified {package}")
          PYTHON

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.target }}-${{ matrix.arch }}
          path: |-
            dist/packages/${{ matrix.target }}-${{ env.TAG }}.tgz
            dist/packages/${{ matrix.target }}-${{ env.TAG }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7
