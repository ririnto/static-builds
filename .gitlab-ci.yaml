stages:
  - checks
  - prepare
  - package

validate-contributor-checks:
  stage: checks
  image: node:26.13.0-trixie
  before_script:
    - sh .gitlab/install-validation-tools.sh
    - export PATH="/usr/local/go/bin:$PATH"
    - npm install --global "$(node -p 'require("./package.json").packageManager')"
    - pnpm install --frozen-lockfile
  script:
    - pnpm run check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"
    - when: never

generate-package-pipeline:
  stage: prepare
  image: golang:1.27.3
  script:
    - >-
      go tool task package-pipeline "BRANCH=${CI_COMMIT_BRANCH:-}" "COMPONENT_REF=${CI_SERVER_FQDN}/${CI_PROJECT_PATH}/static-release@${CI_COMMIT_REF_NAME}" > package-pipeline.yaml
  artifacts:
    paths:
      - package-pipeline.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - when: never

run-package-pipeline:
  stage: package
  trigger:
    include:
      - artifact: package-pipeline.yaml
        job: generate-package-pipeline
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
      when: manual
    - when: never
