stages:
  - checks
  - prepare
  - package

validate-contributor-checks:
  stage: checks
  image: golang:1.27.3-alpine
  before_script:
    - apk add --no-cache ca-certificates git
    - go run ./cmd/install-validation-tools
  script:
    - go test ./...
    - go tool task lint
    - go tool task shfmt-check
    - go tool task jsonnet-check
    - go tool task jsonnetfmt-check
    - rumdl check --enable MD046 --no-cache --respect-gitignore .
    - lychee --config .lychee.toml '**/*.md'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"
    - when: never

generate-package-pipeline:
  stage: prepare
  image: golang:1.27.3-alpine
  before_script:
    - apk add --no-cache ca-certificates git
  script:
    - >-
      go tool task package-pipeline "BRANCH=${CI_COMMIT_BRANCH:-}" "COMPONENT_REF=${CI_SERVER_FQDN}/${CI_PROJECT_PATH}/static-release@${CI_COMMIT_REF_NAME}" > package-pipeline.yaml
  artifacts:
    paths:
      - package-pipeline.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - when: never

run-package-pipeline:
  stage: package
  trigger:
    include:
      - artifact: package-pipeline.yaml
        job: generate-package-pipeline
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
      when: manual
    - when: never
