stages:
  - checks
  - prepare
  - package

validate-contributor-checks:
  stage: checks
  image: golang:1.27.3-alpine
  before_script:
    - apk add --no-cache ca-certificates git
    - go run ./cmd/install-validation-tools
    - test "$(apk --print-arch)" = x86_64
    - curl --fail --location --silent --show-error "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-x64-musl.tar.xz" --output /tmp/node.tar.xz
    - tar --extract --xz --file /tmp/node.tar.xz --directory /usr/local --strip-components=1
    - rm /tmp/node.tar.xz
    - npm install --global pnpm@12.16.1
    - pnpm install --frozen-lockfile
  script:
    - pnpm run check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"
    - when: never

generate-package-pipeline:
  stage: prepare
  image: golang:1.27.3-alpine
  before_script:
    - apk add --no-cache ca-certificates git
  script:
    - >-
      go tool task package-pipeline "BRANCH=${CI_COMMIT_BRANCH:-}" "COMPONENT_REF=${CI_SERVER_FQDN}/${CI_PROJECT_PATH}/static-release@${CI_COMMIT_REF_NAME}" > package-pipeline.yaml
  artifacts:
    paths:
      - package-pipeline.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - when: never

run-package-pipeline:
  stage: package
  trigger:
    include:
      - artifact: package-pipeline.yaml
        job: generate-package-pipeline
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
      when: manual
    - when: never
