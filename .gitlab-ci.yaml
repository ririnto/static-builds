workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

variables:
  APK_CACHE_DIR: .cache/apk

stages:
  - checks
  - prepare
  - package

check:
  stage: checks
  image: golang:alpine
  cache:
    key: "apk-golang-alpine-${CI_RUNNER_ID}"
    paths:
      - "$APK_CACHE_DIR/*.apk"
  before_script:
    - mkdir -p "$APK_CACHE_DIR"
    - apk --cache-dir "$APK_CACHE_DIR" add --update-cache ca-certificates git
  script:
    - go tool task test
    - go tool task golangci-lint -- run ./...
    - go tool task shfmt -- -d
    - go tool task jsonnetfmt -- --test

generate-package-pipeline:
  stage: prepare
  image: golang:alpine
  cache:
    key: "apk-golang-alpine-${CI_RUNNER_ID}"
    paths:
      - "$APK_CACHE_DIR/*.apk"
  before_script:
    - mkdir -p "$APK_CACHE_DIR"
    - apk --cache-dir "$APK_CACHE_DIR" add --update-cache ca-certificates git
  script:
    - |-
      target=
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        target=$(go tool task manifest -- get-target-from-tag "$CI_COMMIT_TAG")
      fi
      go tool task jsonnet -- -S --ext-str "branch=${CI_COMMIT_BRANCH:-}" --ext-str "target=$target" --ext-str "component_ref=${CI_SERVER_FQDN}/${CI_PROJECT_PATH}/static-release@${CI_COMMIT_REF_NAME}" --tla-str "release_tag=${CI_COMMIT_TAG:-}" >package-pipeline.gitlab-ci.yaml
  artifacts:
    paths:
      - package-pipeline.gitlab-ci.yaml
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - when: never

run-package-pipeline:
  stage: package
  trigger:
    strategy: mirror
    include:
      - artifact: package-pipeline.gitlab-ci.yaml
        job: generate-package-pipeline
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - when: never
