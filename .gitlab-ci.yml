stages:
  - prepare
  - package

generate-package-pipeline:
  stage: prepare
  image: golang:1.27.1
  script:
    - export PATH="/usr/local/go/bin:${GOPATH:-/go}/bin:$PATH"
    - go install github.com/google/go-jsonnet/cmd/jsonnet@v0.22.0
    - |-
      jsonnet -S \
        --ext-str "branch=${CI_COMMIT_BRANCH:-}" \
        --ext-str "target=" \
        --ext-str "component_ref=${CI_SERVER_FQDN}/${CI_PROJECT_PATH}/static-release@${CI_COMMIT_REF_NAME}" \
        .gitlab/ci/package-pipeline.jsonnet \
        > package-pipeline.yaml
  artifacts:
    paths:
      - package-pipeline.yaml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - when: never

run-package-pipeline:
  stage: package
  trigger:
    include:
      - artifact: package-pipeline.yaml
        job: generate-package-pipeline
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.+$/'
    - when: never
