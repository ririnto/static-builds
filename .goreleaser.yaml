version: 2

dist: dist/release

before:
  hooks:
    - |-
      sh -eu -c '
        files=$(go tool task manifest -- get-release-files "$TARGET")
        go tool task build -- "$TARGET"
        staging="dist/release-files/$TARGET"
        rm -rf "$staging"
        mkdir -p "$staging"
        while IFS= read -r file; do
          mkdir -p "$staging/$(dirname "$file")"
          cp -a "${BUILD_OUTPUT_DEST:-dist/$TARGET}/$file" "$staging/$file"
        done <<EOF
      $files
      EOF
      '

builds:
  - skip: true

archives:
  - meta: true
    formats:
      - tgz
    name_template: "{{ .Env.TAG }}"
    files:
      - src: "dist/release-files/{{ .Env.TARGET }}"
        dst: .

checksum:
  split: true
  extra_files:
    - glob: '{{ if isEnvSet "RELEASE_ARCHIVE" }}{{ .Env.RELEASE_ARCHIVE }}{{ end }}'

changelog:
  disable: true

release:
  name_template: "{{ .Env.TAG }}"
  draft: false
  prerelease: "false"
  extra_files:
    - glob: "dist/release-package/{{ .Env.TARGET }}/{{ .Env.TAG }}.tgz"
  replace_existing_artifacts: true

gitlab_urls:
  api: "{{ .Env.CI_API_V4_URL }}"
  download: "{{ .Env.CI_SERVER_URL }}"
  use_job_token: true
  use_package_registry: true
