version: 2

dist: .out/goreleaser

builds:
  - skip: true

archives:
  - meta: true
    name_template: "{{ .Env.TAG }}"
    files:
      - src: "{{ .Env.RELEASE_FILES }}"
        dst: .

checksum:
  name_template: "{{ .Env.TAG }}_checksums.txt"
  algorithm: sha256
  extra_files:
    - glob: '{{ if isEnvSet "RELEASE_ARCHIVE" }}{{ .Env.RELEASE_ARCHIVE }}{{ end }}'

changelog:
  disable: true

release:
  name_template: "{{ .Env.TAG }}"
  draft: false
  prerelease: "false"
  extra_files:
    - glob: ".out/release-package/{{ .Env.TAG }}.tar.gz"
  replace_existing_artifacts: true

gitlab_urls:
  api: "{{ .Env.CI_API_V4_URL }}"
  download: "{{ .Env.CI_SERVER_URL }}"
  use_job_token: true
  use_package_registry: true
