version: 2

before:
  hooks:
    - go tool task build -- {{ .Env.TARGET }} --output type=local,dest=.cache/build/{{ .Env.TARGET }} {{ if isEnvSet "BUILDKIT_ARGS" }}{{ .Env.BUILDKIT_ARGS }}{{ end }}

builds:
  - skip: true

archives:
  - meta: true
    formats:
      - tgz
    name_template: "{{ .Env.TARGET }}-{{ .Env.TAG }}"
    files:
      - src: '.cache/build/{{ .Env.TARGET }}/{ {{- replace (filter .Env.RELEASE_FILES "^bin/") "\n" "," -}} }'
        dst: bin
      - src: '.cache/build/{{ .Env.TARGET }}/{ {{- replace (filter .Env.RELEASE_FILES "^sbin/") "\n" "," -}} }'
        dst: sbin
      - src: '.cache/build/{{ .Env.TARGET }}/{ {{- replace (filter .Env.RELEASE_FILES "^[^/]+$") "\n" "," -}} }'
        dst: .

checksum:
  split: true
  extra_files:
    - glob: '{{ if isEnvSet "RELEASE_ARCHIVE" }}{{ .Env.RELEASE_ARCHIVE }}{{ end }}'

changelog:
  disable: true

release:
  name_template: "{{ .Env.TAG }}"
  draft: false
  prerelease: "false"
  extra_files:
    - glob: '{{ if isEnvSet "RELEASE_ARCHIVE" }}{{ .Env.RELEASE_ARCHIVE }}{{ end }}'
  replace_existing_artifacts: true

gitlab_urls:
  api: "{{ .Env.CI_API_V4_URL }}"
  download: "{{ .Env.CI_SERVER_URL }}"
  use_job_token: true
  use_package_registry: true
