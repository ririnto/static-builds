version: "3"

silent: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - "{{.TASK_EXE | shellQuote}} --list"

  build:
    desc: Download sources and build a target (-- <target> [buildx args...])
    cmds:
      - |-
        set -e
        set -- {{.CLI_ARGS}}
        go run ./cmd/download "${1:-}"
        ROOT_DIR=$(pwd)
        TARGET="$1"
        shift
        METADATA_ENV=$(go tool task manifest -- get-env "${TARGET}")
        BUILDKIT_PLATFORM="${BUILDKIT_PLATFORM:-linux/amd64}"
        BUILDKIT_CACHE_BACKEND="${BUILDKIT_CACHE_BACKEND:-local}"
        BUILDKIT_NETWORK="${BUILDKIT_NETWORK:-default}"
        case "${BUILDKIT_CACHE_BACKEND}" in
          local)
            CACHE_DIR="${CACHE_DIR:-${ROOT_DIR}/.cache/${TARGET}}"
            mkdir -p "${CACHE_DIR}"
            CACHE_FROM="type=local,src=${CACHE_DIR}"
            CACHE_TO="type=local,dest=${CACHE_DIR},mode=max"
            ;;
          gha)
            CACHE_FROM="type=gha,scope=${TARGET}"
            CACHE_TO="type=gha,mode=max,scope=${TARGET}"
            ;;
          *)
            echo "Error: Invalid BUILDKIT_CACHE_BACKEND '${BUILDKIT_CACHE_BACKEND}' (allowed: local, gha)" >&2
            exit 1
            ;;
        esac
        BUILD_OUTPUT_DEST="${BUILD_OUTPUT_DEST:-${ROOT_DIR}/.out/${TARGET}}"
        mkdir -p "${BUILD_OUTPUT_DEST}"
        while IFS='=' read -r key value || [ -n "${key}" ]; do
          case "$key" in
            '' | \#* | *[!A-Z0-9_]*) ;;
            *)
              if [ -n "$value" ]; then
                value=$(printf '%s' "$value" | tr -d '\r')
                set -- "--build-arg=${key}=${value}" "$@"
              fi
              ;;
          esac
        done <<EOF
        ${METADATA_ENV}
        EOF
        cd "${ROOT_DIR}"
        docker buildx build \
          "--platform=${BUILDKIT_PLATFORM}" \
          "--network=${BUILDKIT_NETWORK}" \
          "--output=type=local,dest=${BUILD_OUTPUT_DEST}" \
          "--cache-from=${CACHE_FROM}" \
          "--cache-to=${CACHE_TO}" \
          "$@" \
          "--file=${ROOT_DIR}/${TARGET}/Dockerfile" \
          "${ROOT_DIR}"

  buildctl:
    desc: Run the BuildKit client
    cmds:
      - go tool buildctl {{.CLI_ARGS}}

  download:
    desc: Download a target's sources (-- <target>)
    cmds:
      - go run ./cmd/download {{.CLI_ARGS}}

  manifest:
    desc: Query manifest metadata (-- <command> <argument>)
    cmds:
      - go run ./cmd/metadata {{.CLI_ARGS}}

  release:
    desc: Check Go module release compatibility
    cmds:
      - go tool gorelease {{.CLI_ARGS}}

  jsonnet:
    desc: Render the GitLab package pipeline
    cmds:
      - go tool jsonnet {{.CLI_ARGS}} .gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  jsonnetfmt:
    desc: Format the GitLab package pipeline
    cmds:
      - go tool jsonnetfmt {{.CLI_ARGS}} .gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  shfmt:
    desc: Format maintained shell scripts
    cmds:
      - git ls-files -z -- '**/*.sh' | xargs -0 go tool shfmt {{.CLI_ARGS}}

  golangci-lint:
    desc: Lint Go source
    cmds:
      - go tool golangci-lint {{.CLI_ARGS}}
