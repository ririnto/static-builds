version: "3"

silent: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - "{{.TASK_EXE | shellQuote}} --list"

  build:
    desc: Run the low-level Buildx backend (-- <target> [buildx args...])
    cmds:
      - |-
        set -e
        set -- {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        go tool task download -- "${1:-}"
        ROOT_DIR=$(pwd)
        TARGET="$1"
        shift
        METADATA_ENV=$(go tool task manifest -- get-env "${TARGET}")
        case "${BUILDKIT_CACHE_BACKEND:-local}" in
          local)
            CACHE_DIR="${CACHE_DIR:-${ROOT_DIR}/.cache/${TARGET}}"
            mkdir -p "${CACHE_DIR}"
            set -- "--cache-from=type=local,src=${CACHE_DIR}" "--cache-to=type=local,dest=${CACHE_DIR},mode=max" "$@"
            ;;
          gha)
            set -- "--cache-from=type=gha,scope=${TARGET}" "--cache-to=type=gha,mode=max,scope=${TARGET}" "$@"
            ;;
          *)
            echo "Error: Invalid BUILDKIT_CACHE_BACKEND '${BUILDKIT_CACHE_BACKEND}' (allowed: local, gha)" >&2
            exit 1
            ;;
        esac
        BUILD_OUTPUT_DEST="${BUILD_OUTPUT_DEST:-${ROOT_DIR}/dist/${TARGET}}"
        mkdir -p "${BUILD_OUTPUT_DEST}"
        while IFS='=' read -r key value || [ -n "${key}" ]; do
          case "$key" in
            '' | \#* | *[!A-Z0-9_]*) ;;
            *)
              if [ -n "$value" ]; then
                value=$(printf '%s' "$value" | tr -d '\r')
                set -- "--build-arg=${key}=${value}" "$@"
              fi
              ;;
          esac
        done <<EOF
        ${METADATA_ENV}
        EOF
        cd "${ROOT_DIR}"
        docker buildx build \
          "--platform=${BUILDKIT_PLATFORM:-linux/amd64}" \
          "--network=${BUILDKIT_NETWORK:-default}" \
          "--output=type=local,dest=${BUILD_OUTPUT_DEST}" \
          "$@" \
          "--file=${ROOT_DIR}/${TARGET}/Dockerfile" \
          "${ROOT_DIR}"

  build-rootless:
    desc: Run the low-level rootless BuildKit backend (-- <target> [buildctl args...])
    cmds:
      - |-
        set -e
        set -- {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        go tool task download -- "${1:-}"
        TARGET="$1"
        shift
        METADATA_ENV=$(go tool task manifest -- get-env "$TARGET")
        mkdir -p ".cache/$TARGET" "${BUILD_OUTPUT_DEST:-dist/$TARGET}"
        while IFS='=' read -r key value; do
          set -- --opt "build-arg:$key=$value" "$@"
        done <<EOF
        ${METADATA_ENV}
        EOF
        go mod download github.com/moby/buildkit
        BUILDCTL="go tool buildctl" sh "$(go list -m -f '{{"{{.Dir}}"}}' github.com/moby/buildkit)/examples/buildctl-daemonless/buildctl-daemonless.sh" build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --opt "filename=$TARGET/Dockerfile" \
          --opt "platform=${BUILDKIT_PLATFORM:-linux/amd64}" \
          --output "type=local,dest=${BUILD_OUTPUT_DEST:-dist/$TARGET}" \
          --import-cache "type=local,src=.cache/$TARGET" \
          --export-cache "type=local,dest=.cache/$TARGET,mode=max" \
          "$@"

  buildctl:
    desc: Run the BuildKit client
    cmds:
      - go tool buildctl {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  download:
    desc: Download a target's sources (-- <target>)
    cmds:
      - go run ./cmd/download {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  manifest:
    desc: Query manifest metadata (-- <command> <argument>)
    cmds:
      - go run ./cmd/metadata {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  validate-release-tag:
    desc: Validate a target's manifest-selected release tag (-- <target> <tag>)
    cmds:
      - |-
        set -e
        set -- {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        TARGET="${1:?release target is required}"
        TAG="${2:?release tag is required}"
        prefix=$(go tool task manifest -- get-tag-prefix "$TARGET")
        official=$(go tool task manifest -- get-official-version "$TARGET")
        test "${TAG#"$prefix"-}" != "$TAG"
        version_revision=${TAG#"$prefix"-}
        test "${version_revision%.*}" != "$version_revision"
        version=${version_revision%.*}
        echo "${version_revision##*.}" | grep -E '^[0-9]+$'
        if [ "$version" != "$official" ]; then
          test "${version#"$official"-}" != "$version"
          echo "${version#"$official"-}" | grep -E '^[A-Za-z0-9]+([.-][A-Za-z0-9]+)*$'
        fi

  goreleaser:
    desc: Build, package, hash, and publish through GoReleaser (-- <args...>)
    cmds:
      - |-
        set -e
        set -- {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        if [ "${1:-}" = release ]; then
          case "${TARGET:?build target is required}" in
            *[!A-Za-z0-9_-]*)
              echo "Error: Invalid target directory name '$TARGET'" >&2
              exit 1
              ;;
          esac
          go tool task manifest -- get-release-files "${TARGET:?build target is required}"
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          grep -qx 'dist: dist/release' .goreleaser.yaml
          sed "s|^dist: dist/release$|dist: dist/release/$TARGET|" .goreleaser.yaml >"$config"
          go tool goreleaser "$@" --config "$config"
        else
          go tool goreleaser "$@"
        fi

  jsonnet:
    desc: Render the GitLab package pipeline
    cmds:
      - go tool jsonnet {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}.gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  jsonnetfmt:
    desc: Format the GitLab package pipeline
    cmds:
      - go tool jsonnetfmt {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}.gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  test:
    desc: Test Go commands
    cmds:
      - go test ./... {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  fmt:
    desc: Format Go source
    cmds:
      - go fmt ./... {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  shfmt:
    desc: Format maintained shell scripts
    vars:
      SHELL_PATHS:
        sh: git ls-files -z '*.sh' '.husky/pre-*'
      SHELL_FILES:
        ref: 'splitList "\x00" .SHELL_PATHS | compact'
    cmds:
      - for:
          var: SHELL_FILES
        cmd: go tool shfmt -i 2 -ci {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}-- {{.ITEM | shellQuote}}

  golangci-lint:
    desc: Lint Go source
    cmds:
      - go tool golangci-lint {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
