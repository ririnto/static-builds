version: "3"

silent: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - "{{.TASK_EXE | shellQuote}} --list"

  build:
    desc: Download sources and build a target (-- <target> [buildx args...])
    cmds:
      - |-
        set -e
        set -- {{.CLI_ARGS}}
        go run ./cmd/download "${1:-}"
        ROOT_DIR=$(pwd)
        usage() {
          echo "Usage: go tool task build -- <target> [buildx args...]"
          echo ""
          echo "Arguments:"
          echo "  target          Build target (e.g., nginx, haproxy, apache-httpd)"
          echo "  buildx args     Additional arguments passed to docker buildx build"
          echo ""
          echo "Environment variables:"
          echo "  BUILDKIT_PLATFORM     Target platform for cross-platform builds"
          echo "                      Default: linux/amd64"
          echo "                      Example: BUILDKIT_PLATFORM=linux/arm64"
          echo "  BUILD_OUTPUT_DEST     Output destination directory for build artifacts"
          echo "                      Default: .out/<target>/"
          echo "                      Example (CI): .out/<target>/"
          echo "                      Example: BUILD_OUTPUT_DEST=/custom/output/nginx"
          echo "  BUILDKIT_CACHE_BACKEND Cache backend type for Docker BuildKit"
          echo "                      Default: local"
          echo "                      Allowed: local, gha"
          echo "                      Example: BUILDKIT_CACHE_BACKEND=gha"
          echo "  BUILDKIT_NETWORK      Network mode for Docker BuildKit"
          echo "                      Default: default"
          echo "                      Allowed: default, host, none"
          echo "                      Example: BUILDKIT_NETWORK=default"
          echo ""
          echo "Examples:"
          echo "  go tool task build -- nginx"
          echo "  go tool task build -- haproxy --progress=plain"
          echo "  BUILDKIT_PLATFORM=linux/arm64 go tool task build -- nginx"
          echo "  BUILD_OUTPUT_DEST=.out/custom/nginx go tool task build -- nginx"
          exit 1
        }
        if [ "$#" -lt 1 ] || [ -z "$1" ]; then
          echo "Error: TARGET is required; pass a target as the first argument." >&2
          usage
        fi
        TARGET="$1"
        shift
        case "${TARGET}" in
          *[!A-Za-z0-9._-]*)
            echo "Error: Invalid target '${TARGET}'"
            echo "Allowed characters: letters, numbers, dot, underscore, hyphen"
            exit 1
            ;;
        esac
        if [ ! -d "${ROOT_DIR}/${TARGET}" ]; then
          echo "Error: Target directory '${TARGET}' not found"
          exit 1
        fi
        if [ ! -f "${ROOT_DIR}/${TARGET}/Dockerfile" ]; then
          echo "Error: Dockerfile not found in '${TARGET}'"
          exit 1
        fi
        cd "${ROOT_DIR}"
        METADATA_ENV=$(go tool task manifest -- get-env "${TARGET}")
        BUILDKIT_PLATFORM="${BUILDKIT_PLATFORM:-linux/amd64}"
        BUILDKIT_CACHE_BACKEND="${BUILDKIT_CACHE_BACKEND:-local}"
        BUILDKIT_NETWORK="${BUILDKIT_NETWORK:-default}"
        case "${BUILDKIT_CACHE_BACKEND}" in
          local)
            CACHE_DIR="${CACHE_DIR:-${ROOT_DIR}/.cache/${TARGET}}"
            mkdir -p "${CACHE_DIR}"
            CACHE_FROM="type=local,src=${CACHE_DIR}"
            CACHE_TO="type=local,dest=${CACHE_DIR},mode=max"
            ;;
          gha)
            CACHE_FROM="type=gha,scope=${TARGET}"
            CACHE_TO="type=gha,mode=max,scope=${TARGET}"
            ;;
          *)
            echo "Error: Invalid BUILDKIT_CACHE_BACKEND '${BUILDKIT_CACHE_BACKEND}'"
            echo "Allowed values: local, gha"
            exit 1
            ;;
        esac
        BUILD_OUTPUT_DEST="${BUILD_OUTPUT_DEST:-${ROOT_DIR}/.out/${TARGET}}"
        mkdir -p "${BUILD_OUTPUT_DEST}"
        while IFS='=' read -r key value || [ -n "${key}" ]; do
          case "$key" in
            '' | \#* | *[!A-Z0-9_]*) ;;
            *)
              if [ -n "$value" ]; then
                value=$(printf '%s' "$value" | tr -d '\r')
                set -- "--build-arg=${key}=${value}" "$@"
              fi
              ;;
          esac
        done <<EOF
        ${METADATA_ENV}
        EOF
        cd "${ROOT_DIR}"
        docker buildx build \
          "--platform=${BUILDKIT_PLATFORM}" \
          "--network=${BUILDKIT_NETWORK}" \
          "--output=type=local,dest=${BUILD_OUTPUT_DEST}" \
          "--cache-from=${CACHE_FROM}" \
          "--cache-to=${CACHE_TO}" \
          "$@" \
          "--file=${ROOT_DIR}/${TARGET}/Dockerfile" \
          "${ROOT_DIR}"

  buildctl:
    desc: Run the BuildKit client
    cmds:
      - go tool buildctl {{.CLI_ARGS}}

  download:
    desc: Download a target's sources (-- <target>)
    cmds:
      - go run ./cmd/download {{.CLI_ARGS}}

  manifest:
    desc: Query manifest metadata (-- <command> <argument>)
    cmds:
      - go run ./cmd/metadata {{.CLI_ARGS}}

  release:
    desc: Check Go module release compatibility
    cmds:
      - go tool gorelease {{.CLI_ARGS}}

  jsonnet:
    desc: Render the GitLab package pipeline
    cmds:
      - go tool jsonnet {{.CLI_ARGS}} .gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  jsonnetfmt:
    desc: Format the GitLab package pipeline
    cmds:
      - go tool jsonnetfmt {{.CLI_ARGS}} .gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  shfmt:
    desc: Format maintained shell scripts
    cmds:
      - git ls-files -z -- '**/*.sh' | xargs -0 go tool shfmt {{.CLI_ARGS}}

  golangci-lint:
    desc: Lint Go source
    cmds:
      - go tool golangci-lint {{.CLI_ARGS}}
