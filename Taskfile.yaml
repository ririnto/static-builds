version: "3"

silent: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - "{{.TASK_EXE | shellQuote}} --list"

  build:
    desc: Run rootless BuildKit (-- <target> [buildctl args...])
    vars:
      METADATA_ENV:
        sh: go tool task manifest -- get-env {{index .CLI_ARGS_LIST 0 | shellQuote}}
    cmds:
      - |-
        sh "$(go list -find -f '{{"{{.Module.Dir}}"}}' github.com/moby/buildkit/cmd/buildctl)/examples/buildctl-daemonless/buildctl-daemonless.sh" build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local {{printf "dockerfile=%s" (index .CLI_ARGS_LIST 0) | shellQuote}} \
          --opt filename=Dockerfile \
          --opt "platform=${BUILDKIT_PLATFORM:-linux/amd64}" \
          {{range reverse (splitList "\n" .METADATA_ENV)}}--opt {{printf "build-arg:%s" . | shellQuote}} {{end}}{{range slice .CLI_ARGS_LIST 1}}{{. | shellQuote}} {{end}}

  snapshot:
    desc: Download, build, and package without publishing (-- <target> [buildctl args...])
    cmds:
      - go tool task download -- {{index .CLI_ARGS_LIST 0 | shellQuote}}
      - go tool task build -- {{index .CLI_ARGS_LIST 0 | shellQuote}} --output {{printf "type=local,dest=dist/%s" (index .CLI_ARGS_LIST 0) | shellQuote}} {{range slice .CLI_ARGS_LIST 1}}{{. | shellQuote}} {{end}}
      - go tool task goreleaser -- {{index .CLI_ARGS_LIST 0 | shellQuote}} release --clean --snapshot --verbose --timeout=6h --skip=publish,validate

  buildctl:
    desc: Run the BuildKit client
    cmds:
      - go tool buildctl {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  download:
    desc: Download a target's sources (-- <target>)
    cmds:
      - go run ./cmd/download {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  manifest:
    desc: Query manifest metadata (-- <command> <argument>)
    cmds:
      - go run ./cmd/metadata {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  goreleaser:
    desc: Package, hash, and publish through GoReleaser (-- <target> <args...>)
    vars:
      RELEASE_FILES:
        sh: go tool task manifest -- get-release-files {{index .CLI_ARGS_LIST 0 | shellQuote}}
    env:
      TARGET: "{{index .CLI_ARGS_LIST 0}}"
      RELEASE_FILES: "{{.RELEASE_FILES}}"
    cmds:
      - go tool goreleaser {{range slice .CLI_ARGS_LIST 1}}{{. | shellQuote}} {{end}}

  jsonnet:
    desc: Render the GitLab package pipeline
    cmds:
      - go tool jsonnet {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}.gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  jsonnetfmt:
    desc: Format the GitLab package pipeline
    cmds:
      - go tool jsonnetfmt {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}.gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  test:
    desc: Test Go commands
    cmds:
      - go test ./... {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  fmt:
    desc: Format Go source
    cmds:
      - go fmt ./... {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  shfmt:
    desc: Format maintained shell scripts
    vars:
      SHELL_PATHS:
        sh: git ls-files -z '*.sh' '.husky/pre-*'
      SHELL_FILES:
        ref: 'splitList "\x00" .SHELL_PATHS | compact'
    cmds:
      - for:
          var: SHELL_FILES
        cmd: go tool shfmt -i 2 -ci {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}-- {{.ITEM | shellQuote}}

  golangci-lint:
    desc: Lint Go source
    cmds:
      - go tool golangci-lint {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  nilaway:
    desc: Analyze repository Go packages for potential nil dereferences
    cmds:
      - go tool nilaway {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
