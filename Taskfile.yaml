version: "3"

silent: true

tasks:
  default:
    desc: List available tasks
    cmds:
      - "{{.TASK_EXE | shellQuote}} --list"

  build:
    desc: Run rootless BuildKit (-- <target> [buildctl args...])
    cmds:
      - |-
        set -e
        if [ "$(id -u)" -eq 0 ]; then
          echo "Error: BuildKit must run as a non-root user" >&2
          exit 1
        fi
        set -- {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        go tool task download -- "${1:-}"
        TARGET="$1"
        shift
        METADATA_ENV=$(go tool task manifest -- get-env "$TARGET")
        CACHE_DIR="${CACHE_DIR:-.cache/$TARGET}"
        BUILD_OUTPUT_DEST="${BUILD_OUTPUT_DEST:-dist/$TARGET}"
        case "${BUILDKIT_CACHE_BACKEND:-local}" in
          local)
            mkdir -p "$CACHE_DIR"
            set -- --import-cache "type=local,src=$CACHE_DIR" --export-cache "type=local,dest=$CACHE_DIR,mode=max" "$@"
            ;;
          gha)
            set -- --import-cache "type=gha,scope=$TARGET" --export-cache "type=gha,scope=$TARGET,mode=max" "$@"
            ;;
          *)
            echo "Error: Invalid BUILDKIT_CACHE_BACKEND '${BUILDKIT_CACHE_BACKEND}' (allowed: local, gha)" >&2
            exit 1
            ;;
        esac
        case "${BUILDKIT_NETWORK:-default}" in
          default) ;;
          host | none)
            set -- --opt "force-network-mode=$BUILDKIT_NETWORK" "$@"
            ;;
          *)
            echo "Error: Invalid BUILDKIT_NETWORK '${BUILDKIT_NETWORK}' (allowed: default, host, none)" >&2
            exit 1
            ;;
        esac
        mkdir -p "$BUILD_OUTPUT_DEST"
        while IFS='=' read -r key value || [ -n "$key" ]; do
          case "$key" in
            '' | \#* | *[!A-Z0-9_]*) ;;
            *)
              if [ -n "$value" ]; then
                value=$(printf '%s' "$value" | tr -d '\r')
                set -- --opt "build-arg:$key=$value" "$@"
              fi
              ;;
          esac
        done <<EOF
        ${METADATA_ENV}
        EOF
        runtime=$(mktemp -d)
        trap 'rm -rf "$runtime"' EXIT
        mkdir -p "$runtime/context/.cache/downloads/$TARGET"
        cp -a "$TARGET" "$runtime/context/"
        for archive in ".cache/downloads/$TARGET/"*; do
          case "$archive" in
            *.lock | *.tmp.*) ;;
            *)
              if [ -f "$archive" ] && [ -s "$archive" ]; then
                cp -a "$archive" "$runtime/context/.cache/downloads/$TARGET/"
              fi
              ;;
          esac
        done
        export XDG_RUNTIME_DIR="$runtime"
        export BUILDKITD_FLAGS="--root=${XDG_DATA_HOME:-$HOME/.local/share}/buildkit/$TARGET --oci-worker-snapshotter=native ${BUILDKITD_FLAGS:-}"
        go mod download github.com/moby/buildkit
        BUILDCTL="go tool buildctl" sh "$(go list -m -f '{{"{{.Dir}}"}}' github.com/moby/buildkit)/examples/buildctl-daemonless/buildctl-daemonless.sh" build \
          --frontend dockerfile.v0 \
          --local "context=$runtime/context" \
          --local "dockerfile=$runtime/context/$TARGET" \
          --opt filename=Dockerfile \
          --opt "platform=${BUILDKIT_PLATFORM:-linux/amd64}" \
          --output "type=local,dest=$BUILD_OUTPUT_DEST" \
          "$@"

  buildctl:
    desc: Run the BuildKit client
    cmds:
      - go tool buildctl {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  download:
    desc: Download a target's sources (-- <target>)
    cmds:
      - go run ./cmd/download {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  manifest:
    desc: Query manifest metadata (-- <command> <argument>)
    cmds:
      - go run ./cmd/metadata {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  goreleaser:
    desc: Build, package, hash, and publish through GoReleaser (-- <args...>)
    cmds:
      - |-
        set -e
        set -- {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
        if [ "${1:-}" = release ]; then
          case "$TARGET" in
            *[!A-Za-z0-9_-]*)
              echo "Error: Invalid target directory name '$TARGET'" >&2
              exit 1
              ;;
          esac
          go tool task manifest -- get-release-files "$TARGET"
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          grep -qx 'dist: dist/release' .goreleaser.yaml
          sed "s|^dist: dist/release$|dist: dist/release/$TARGET|" .goreleaser.yaml >"$config"
          go tool goreleaser "$@" --config "$config"
        else
          go tool goreleaser "$@"
        fi

  jsonnet:
    desc: Render the GitLab package pipeline
    cmds:
      - go tool jsonnet {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}.gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  jsonnetfmt:
    desc: Format the GitLab package pipeline
    cmds:
      - go tool jsonnetfmt {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}.gitlab/ci/package-pipeline.gitlab-ci.jsonnet

  test:
    desc: Test Go commands
    cmds:
      - go test ./... {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  fmt:
    desc: Format Go source
    cmds:
      - go fmt ./... {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}

  shfmt:
    desc: Format maintained shell scripts
    vars:
      SHELL_PATHS:
        sh: git ls-files -z '*.sh' '.husky/pre-*'
      SHELL_FILES:
        ref: 'splitList "\x00" .SHELL_PATHS | compact'
    cmds:
      - for:
          var: SHELL_FILES
        cmd: go tool shfmt -i 2 -ci {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}-- {{.ITEM | shellQuote}}

  golangci-lint:
    desc: Lint Go source
    cmds:
      - go tool golangci-lint {{range .CLI_ARGS_LIST}}{{. | shellQuote}} {{end}}
