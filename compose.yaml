services:
  build:
    build:
      context: .
      args:
        BUILDER_UID: ${BUILDER_UID:-1000}
      dockerfile_inline: |-
        FROM golang:alpine
        ARG TARGETARCH
        ARG BUILDER_UID=1000
        RUN --mount=type=cache,id=static-builds-compose-apk-$$TARGETARCH,target=/var/cache/apk,sharing=locked apk --cache-dir=/var/cache/apk add --update-cache ca-certificates git buildkit runc rootlesskit shadow-uidmap
        RUN adduser -D -u "$$BUILDER_UID" user
        RUN echo user:100000:65536 > /etc/subuid
        RUN echo user:100000:65536 > /etc/subgid
        RUN mkdir -p /run/user/$$BUILDER_UID /home/user/.local/tmp /home/user/.local/share/buildkit /home/user/.cache/go-build /home/user/go/pkg/mod
        RUN chown -R user:user /run/user/$$BUILDER_UID /home/user
        RUN chmod 700 /run/user/$$BUILDER_UID
        ENV HOME=/home/user
        ENV USER=user
        ENV GOPATH=/home/user/go
        ENV XDG_RUNTIME_DIR=/run/user/$$BUILDER_UID
        ENV TMPDIR=/home/user/.local/tmp
        USER user
        WORKDIR /workspace
    environment:
      TARGET: ${TARGET:-}
      TAG: ${TAG:-local}
      GORELEASER_CURRENT_TAG: ${TAG:-local}
      BUILDKIT_PLATFORM: ${BUILDKIT_PLATFORM:-linux/amd64}
      GOFLAGS: -buildvcs=false
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    entrypoint:
      - go
      - tool
      - task
      - goreleaser
      - --
      - release
      - --clean
      - --snapshot
      - --verbose
      - --timeout=6h
      - "--skip=publish,validate"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: .cache
        target: /workspace/.cache
        bind:
          create_host_path: false
      - type: bind
        source: dist
        target: /workspace/dist
        bind:
          create_host_path: false
      - buildkit-state:/home/user/.local/share/buildkit
      - go-modules:/home/user/go/pkg/mod
      - go-build:/home/user/.cache/go-build

volumes:
  buildkit-state:
  go-modules:
  go-build:
