worker_processes 2;
error_log stderr notice;
events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.53 valid=10s ipv4=on ipv6=on;
    resolver_timeout 2s;
    vhost_traffic_status_zone shared:vhost_traffic_status:16m;

    upstream api {
        zone api 256k;
        server api-a.internal:8080 resolve;
        server api-b.internal:8080 resolve;
        server fallback.internal:8080 resolve backup;
        server maintenance.internal:8080 down;
        healthcheck type=http interval=1s timeout=500ms fall=3 rise=2 uri=/readyz host=api.internal concurrency=16 shm_size=1m;
        healthcheck_statuses 200 204;
    }

    upstream secure_api {
        zone secure_api 256k;
        server secure-api.internal:8443 resolve;
        healthcheck type=https interval=5s timeout=2s fall=3 rise=2 uri=/readyz host=secure-api.internal;
        healthcheck_tls_name secure-api.internal;
        healthcheck_trusted_certificate conf/backend-ca.pem;
        healthcheck_statuses 200 204;
    }

    upstream tls_only_api {
        zone tls_only_api 256k;
        server tls-api.internal:8443 resolve;
        healthcheck type=tls interval=5s timeout=2s fall=3 rise=2;
        healthcheck_tls_name tls-api.internal;
        healthcheck_trusted_certificate conf/backend-ca.pem;
    }

    server {
        listen 8080;
        location /api/ {
            proxy_pass http://api;
        }
        location /secure/ {
            proxy_pass https://secure_api;
            proxy_ssl_server_name on;
            proxy_ssl_name secure-api.internal;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate conf/backend-ca.pem;
        }
    }

    server {
        listen 127.0.0.1:18080;
        location = /health-metrics {
            allow 127.0.0.1;
            deny all;
            healthcheck_metrics;
        }
        location = /traffic-metrics {
            allow 127.0.0.1;
            deny all;
            vhost_traffic_status_display;
            vhost_traffic_status_display_format prometheus;
        }
    }
}

stream {
    resolver 127.0.0.53 valid=10s ipv4=on ipv6=off;
    resolver_timeout 2s;

    upstream cache {
        zone cache 256k;
        server cache.internal:6379 resolve;
        server cache-backup.internal:6379 resolve backup;
        healthcheck_tcp type=tcp interval=2s timeout=1s fall=3 rise=2 concurrency=16 shm_size=1m max_response=4096;
        healthcheck_send "PING\r\n";
        healthcheck_expect "+PONG\r\n" min_recv=7;
    }

    upstream secure_cache {
        zone secure_cache 256k;
        server secure-cache.internal:6380 resolve;
        healthcheck_tcp type=tls interval=5s timeout=2s fall=3 rise=2;
        healthcheck_tls_name secure-cache.internal;
        healthcheck_trusted_certificate conf/backend-ca.pem;
    }

    upstream secure_protocol_cache {
        zone secure_protocol_cache 256k;
        server secure-protocol-cache.internal:6380 resolve;
        healthcheck_tcp type=tls interval=5s timeout=2s fall=3 rise=2;
        healthcheck_tls_name secure-protocol-cache.internal;
        healthcheck_trusted_certificate conf/backend-ca.pem;
        healthcheck_send "PING\r\n";
        healthcheck_expect "+PONG\r\n" min_recv=7;
    }

    server {
        listen 127.0.0.1:16379;
        proxy_pass cache;
    }
}
