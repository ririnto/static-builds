spec:
  inputs:
    stage:
      default: release
    target:
      type: string
    package_name:
      type: string
    run_policy:
      default: on_success
---
"gitlab-static-package-$[[ inputs.target ]]":
  stage: $[[ inputs.stage ]]
  rules:
    - when: $[[ inputs.run_policy ]]
  image: golang:alpine
  variables:
    BUILDKIT_CACHE_BACKEND: local
    BUILD_OUTPUT_DEST: "$CI_PROJECT_DIR/.out/$[[ inputs.target ]]"
  before_script:
    - apk add --no-cache ca-certificates git rootlesskit shadow-uidmap runc util-linux coreutils su-exec
    - adduser -D -u 1000 builder
    - echo builder:100000:65536 >> /etc/subuid
    - echo builder:100000:65536 >> /etc/subgid
    - chown -R builder:builder "$CI_PROJECT_DIR"
    - export GOPATH="$CI_PROJECT_DIR/.cache/go" GOCACHE="$CI_PROJECT_DIR/.cache/go-build"
  script:
    - su-exec builder go run ./cmd/download "$[[ inputs.target ]]"
    - su-exec builder go run ./cmd/build "$[[ inputs.target ]]"
    - su-exec builder go run ./cmd/package-release "$[[ inputs.target ]]" "$[[ inputs.package_name ]]"
  artifacts:
    paths:
      - ".out/$[[ inputs.target ]]/"
      - "$[[ inputs.package_name ]].tar.gz"
    when: always
