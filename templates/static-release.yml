spec:
  inputs:
    stage:
      default: release
    target:
      type: string
    package_name:
      type: string
    release_tag:
      default: ""
    run_policy:
      default: on_success
---
"gitlab-static-package-$[[ inputs.target ]]":
  stage: $[[ inputs.stage ]]
  when: $[[ inputs.run_policy ]]
  image: golang:alpine
  cache:
    key: "apk-golang-alpine-$[[ inputs.target ]]-${CI_RUNNER_ID}"
    paths:
      - "$APK_CACHE_DIR/*.apk"
  variables:
    APK_CACHE_DIR: .cache/apk
    TARGET: "$[[ inputs.target ]]"
    TAG: "$[[ inputs.package_name ]]"
    GORELEASER_CURRENT_TAG: "$[[ inputs.package_name ]]"
    BUILDKIT_ARGS: --import-cache type=local,src=.cache/$[[ inputs.target ]] --export-cache type=local,dest=.cache/$[[ inputs.target ]],mode=max
    BUILDCTL: go tool buildctl
    BUILDKITD: go tool buildkitd
    XDG_RUNTIME_DIR: /run/user/1000
    BUILDKITD_FLAGS: --root=/home/user/.local/share/buildkit --oci-worker-snapshotter=native --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p "$APK_CACHE_DIR"
    - apk --cache-dir "$APK_CACHE_DIR" add --update-cache ca-certificates git fuse3 fuse-overlayfs runc rootlesskit shadow-uidmap su-exec
    - adduser -D -u 1000 user
    - echo user:100000:65536 > /etc/subuid
    - echo user:100000:65536 > /etc/subgid
    - mkdir -p /run/user/1000 /home/user/.local/tmp /home/user/.local/share/buildkit
    - chown -R user:user /run/user/1000 /home/user "$CI_PROJECT_DIR"
  script:
    - su-exec user env HOME=/home/user USER=user GOPATH=/home/user/go TMPDIR=/home/user/.local/tmp go tool task goreleaser -- release --clean --verbose --timeout=6h --snapshot --skip=publish,validate
  artifacts:
    paths:
      - ".cache/build/$[[ inputs.target ]]/"
      - "dist/$[[ inputs.target ]]-$[[ inputs.package_name ]].tgz"
      - "dist/$[[ inputs.target ]]-$[[ inputs.package_name ]].tgz.sha256"
    when: always

"gitlab-static-release-$[[ inputs.target ]]":
  stage: release
  image: golang:alpine
  cache:
    key: "apk-golang-alpine-$[[ inputs.target ]]-${CI_RUNNER_ID}"
    paths:
      - "$APK_CACHE_DIR/*.apk"
  needs:
    - job: "gitlab-static-package-$[[ inputs.target ]]"
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG == "$[[ inputs.release_tag ]]"'
    - when: never
  variables:
    APK_CACHE_DIR: .cache/apk
    TARGET: "$[[ inputs.target ]]"
    GORELEASER_FORCE_TOKEN: gitlab
    GORELEASER_CURRENT_TAG: "$[[ inputs.release_tag ]]"
    TAG: "$[[ inputs.release_tag ]]"
  before_script:
    - mkdir -p "$APK_CACHE_DIR"
    - apk --cache-dir "$APK_CACHE_DIR" add --update-cache ca-certificates git
  script:
    - RELEASE_ARCHIVE="$(mktemp -d)/$TARGET-$TAG.tgz"
    - export RELEASE_ARCHIVE
    - cp "dist/$TARGET-$TAG.tgz" "$RELEASE_ARCHIVE"
    - GITLAB_TOKEN="$CI_JOB_TOKEN" go tool task goreleaser -- release --clean --skip=before,archive,validate
