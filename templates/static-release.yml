spec:
  inputs:
    stage:
      default: release
    target:
      type: string
    package_name:
      type: string
    run_policy:
      default: on_success
---
"gitlab-static-package-$[[ inputs.target ]]":
  stage: $[[ inputs.stage ]]
  rules:
    - when: $[[ inputs.run_policy ]]
  image: golang:alpine
  services:
    - name: docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    BUILDKIT_CACHE_BACKEND: local
    BUILD_OUTPUT_DEST: "$CI_PROJECT_DIR/.out/$[[ inputs.target ]]"
  before_script:
    - apk add --no-cache ca-certificates git docker-cli docker-cli-buildx
    - docker buildx create --use --driver docker-container
  script:
    - go tool task build -- "$[[ inputs.target ]]"
    - |-
      files=$(mktemp)
      trap 'rm -f "$files"' EXIT
      go tool task manifest -- get-release-files "$[[ inputs.target ]]" > "$files"
      tar -czvf "$[[ inputs.package_name ]].tar.gz" -C ".out/$[[ inputs.target ]]" -T "$files"
  artifacts:
    paths:
      - ".out/$[[ inputs.target ]]/"
      - "$[[ inputs.package_name ]].tar.gz"
    when: always
