spec:
  inputs:
    stage:
      default: release
    target:
      type: string
    package_name:
      type: string
    release_tag:
      default: ""
    run_policy:
      default: on_success
---
"gitlab-static-package-$[[ inputs.target ]]":
  stage: $[[ inputs.stage ]]
  rules:
    - when: $[[ inputs.run_policy ]]
  image: golang:alpine
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    RELEASE_TAG: "$[[ inputs.release_tag ]]"
    BUILD_OUTPUT_DEST: "$CI_PROJECT_DIR/.out/$[[ inputs.target ]]"
  before_script:
    - apk add --no-cache ca-certificates git buildkit fuse3 fuse-overlayfs runc rootlesskit shadow-uidmap su-exec
    - |-
      if [ -n "$RELEASE_TAG" ]; then
        test "$RELEASE_TAG" = "$CI_COMMIT_TAG"
        test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
        go tool task validate-release-tag -- "$[[ inputs.target ]]" "$RELEASE_TAG"
      fi
    - adduser -D -u 1000 user
    - echo user:100000:65536 > /etc/subuid
    - echo user:100000:65536 > /etc/subgid
    - mkdir -p /run/user/1000 /home/user/.local/tmp /home/user/.local/share/buildkit
    - chown -R user:user /run/user/1000 /home/user "$CI_PROJECT_DIR"
  script:
    - su-exec user env HOME=/home/user USER=user GOPATH=/home/user/go XDG_RUNTIME_DIR=/run/user/1000 TMPDIR=/home/user/.local/tmp go tool task build-rootless -- "$[[ inputs.target ]]"
    - su-exec user env HOME=/home/user USER=user GOPATH=/home/user/go XDG_RUNTIME_DIR=/run/user/1000 TMPDIR=/home/user/.local/tmp go tool task package -- "$[[ inputs.target ]]" "$[[ inputs.package_name ]]" --snapshot
  artifacts:
    paths:
      - ".out/$[[ inputs.target ]]/"
      - ".out/goreleaser/$[[ inputs.package_name ]].tar.gz"
      - ".out/goreleaser/$[[ inputs.package_name ]]_checksums.txt"
    when: always

"gitlab-static-release-$[[ inputs.target ]]":
  stage: release
  image: golang:alpine
  needs:
    - job: "gitlab-static-package-$[[ inputs.target ]]"
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG == "$[[ inputs.release_tag ]]"'
    - when: never
  variables:
    GORELEASER_FORCE_TOKEN: gitlab
    GORELEASER_CURRENT_TAG: "$[[ inputs.release_tag ]]"
    TAG: "$[[ inputs.release_tag ]]"
    RELEASE_ARCHIVE: ".out/release-package/$[[ inputs.release_tag ]].tar.gz"
  before_script:
    - apk add --no-cache ca-certificates git
  script:
    - test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
    - go tool task validate-release-tag -- "$[[ inputs.target ]]" "$TAG"
    - mkdir -p .out/release-package
    - cp ".out/goreleaser/$TAG.tar.gz" "$RELEASE_ARCHIVE"
    - GITLAB_TOKEN="$CI_JOB_TOKEN" go tool task goreleaser -- release --clean --skip=archive,validate
