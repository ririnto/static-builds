spec:
  inputs:
    stage:
      default: release
    target:
      type: string
    package_name:
      type: string
    release_tag:
      default: ""
    run_policy:
      default: on_success
---
"gitlab-static-package-$[[ inputs.target ]]":
  stage: $[[ inputs.stage ]]
  rules:
    - when: $[[ inputs.run_policy ]]
  image: golang:alpine
  cache:
    key: "apk-golang-alpine-$[[ inputs.target ]]-${CI_RUNNER_ID}"
    paths:
      - .cache/apk/**/*.apk
  variables:
    TARGET: "$[[ inputs.target ]]"
    TAG: "$[[ inputs.package_name ]]"
    GORELEASER_CURRENT_TAG: "$[[ inputs.package_name ]]"
    BUILD_BACKEND: rootless
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    RELEASE_TAG: "$[[ inputs.release_tag ]]"
    BUILD_OUTPUT_DEST: "$CI_PROJECT_DIR/dist/$[[ inputs.target ]]"
  before_script:
    - sh .gitlab/ci/install-packages.sh ca-certificates git buildkit fuse3 fuse-overlayfs runc rootlesskit shadow-uidmap su-exec
    - |-
      if [ -n "$RELEASE_TAG" ]; then
        test "$RELEASE_TAG" = "$CI_COMMIT_TAG"
        test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
        go tool task validate-release-tag -- "$[[ inputs.target ]]" "$RELEASE_TAG"
      fi
    - adduser -D -u 1000 user
    - echo user:100000:65536 > /etc/subuid
    - echo user:100000:65536 > /etc/subgid
    - mkdir -p /run/user/1000 /home/user/.local/tmp /home/user/.local/share/buildkit
    - chown -R user:user /run/user/1000 /home/user "$CI_PROJECT_DIR"
  script:
    - su-exec user env HOME=/home/user USER=user GOPATH=/home/user/go XDG_RUNTIME_DIR=/run/user/1000 TMPDIR=/home/user/.local/tmp go tool task goreleaser -- release --clean --verbose --timeout=6h --snapshot --skip=publish,validate
  artifacts:
    paths:
      - "dist/$[[ inputs.target ]]/"
      - "dist/release/$[[ inputs.target ]]/$[[ inputs.package_name ]].tar.gz"
      - "dist/release/$[[ inputs.target ]]/$[[ inputs.package_name ]]_checksums.txt"
    when: always

"gitlab-static-release-$[[ inputs.target ]]":
  stage: release
  image: golang:alpine
  cache:
    key: "apk-golang-alpine-$[[ inputs.target ]]-${CI_RUNNER_ID}"
    paths:
      - .cache/apk/**/*.apk
  needs:
    - job: "gitlab-static-package-$[[ inputs.target ]]"
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG == "$[[ inputs.release_tag ]]"'
    - when: never
  variables:
    TARGET: "$[[ inputs.target ]]"
    GORELEASER_FORCE_TOKEN: gitlab
    GORELEASER_CURRENT_TAG: "$[[ inputs.release_tag ]]"
    TAG: "$[[ inputs.release_tag ]]"
    RELEASE_ARCHIVE: "dist/release-package/$[[ inputs.target ]]/$[[ inputs.release_tag ]].tar.gz"
  before_script:
    - sh .gitlab/ci/install-packages.sh ca-certificates git
  script:
    - test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
    - go tool task validate-release-tag -- "$[[ inputs.target ]]" "$TAG"
    - mkdir -p "dist/release-package/$TARGET"
    - cp "dist/release/$TARGET/$TAG.tar.gz" "$RELEASE_ARCHIVE"
    - GITLAB_TOKEN="$CI_JOB_TOKEN" go tool task goreleaser -- release --clean --skip=before,archive,validate
